title: Download Cradle Hidden Inside a Base64 PowerShell Command
id: 6f1c2a10-6a5e-4c1b-9d0e-1a2b3c4d5e04
name: win_ps_hidden_cradle_b64
status: experimental
description: >
  The UTF-16LE base64 payload of -EncodedCommand contains a download-and-execute cradle.
  Matches the encoded text directly, at any byte offset, without decoding.
author: sigma-regression-harness sample pack
date: 2026-11-21
tags: [attack.execution, attack.t1059.001, attack.command-and-control, attack.t1105]
logsource: {product: windows, category: process_creation}
detection:
  selection:
    CommandLine|wide|base64offset|contains: ['DownloadString(', 'DownloadFile(', 'Invoke-WebRequest']
  condition: selection
falsepositives: [Encoded maintenance scripts that fetch content from the internet]
level: high
