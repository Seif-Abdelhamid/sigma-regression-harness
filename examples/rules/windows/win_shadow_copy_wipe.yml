title: Volume Shadow Copies Deleted
id: 6f1c2a10-6a5e-4c1b-9d0e-1a2b3c4d5e03
name: win_shadow_copy_wipe
status: experimental
description: vssadmin or wmic deleting shadow copies, typically right before ransomware encryption.
author: sigma-regression-harness sample pack
date: 2026-11-21
tags: [attack.impact, attack.t1490]
logsource: {product: windows, category: process_creation}
detection:
  sel_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all: ['delete', 'shadows']
  sel_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all: ['shadowcopy', 'delete']
  condition: 1 of sel_*
falsepositives: [Backup software pruning its own snapshots]
level: high
