name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests, lint, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check sigharness tests scripts
      - name: Tests
        run: pytest -q --cov=sigharness --cov-report=term
      - name: Bandit (SAST)
        run: bandit -q -r sigharness scripts
      - name: pip-audit (dependency scan)
        run: pip-audit
